# Multi-service Compose example (#35).
#
# Deploy it as a Norix compose stack:
#   - Variables: DB_PASSWORD=<any value>  (required, #145)
#   - Public services: web                (api and db stay internal, #146)
#   - Domains (optional): web=app.example.com
#
# Locally: DB_PASSWORD=dev-only docker compose up -d --build --wait
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
