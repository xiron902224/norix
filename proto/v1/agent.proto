syntax = "proto3";

package v1;

option go_package = "github.com/xiron902224/norix/control-plane/internal/gen/v1;paasv1";

message NodeCapabilities {
  int32 cpu_cores = 1;
  int64 memory_total_mb = 2;
  bool docker_socket = 3;
  bool containerd_socket = 4;
  uint32 kvm_level = 5;
  string hostname = 6;
  string agent_version = 7;
}

message NodeHeartbeat {
  string node_id = 1;
  double cpu_usage_percent = 2;
  int64 memory_free_mb = 3;
  uint32 kvm_level = 4;
}

message Node {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string status = 4;
  string last_seen_at = 5;
  NodeCapabilities capabilities = 6;
  bool is_local = 7;
  double cpu_usage_percent = 8;
  int64 memory_free_mb = 9;
  int64 disk_free_mb = 10;
}

message CreateJoinTokenRequest {
  string node_name = 1;
  int64 ttl_seconds = 2;
}

message CreateJoinTokenResponse {
  string token = 1;
  string expires_at = 2;
}

message EnrollNodeRequest {
  string join_token = 1;
  string node_name = 2;
  NodeCapabilities capabilities = 3;
}

message EnrollNodeResponse {
  string node_id = 1;
  string node_token = 2;
  string organization_id = 3;
}

message DesiredWorkload {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string image = 4;
  map<string, string> env_vars = 5;
  int32 cpu_shares = 6;
  int64 memory_limit_mb = 7;
  int32 host_port = 8;
  int32 container_port = 9;
  int64 desired_generation = 10;
  string action = 11;
}

message ObservedWorkload {
  string id = 1;
  string status = 2;
  string container_id = 3;
  int64 observed_generation = 4;
  string message = 5;
  int32 host_port = 6;
  repeated string log_lines = 7;
}

message HeartbeatRequest {
  string node_id = 1;
  double cpu_usage_percent = 2;
  int64 memory_free_mb = 3;
  string status = 4;
  repeated string running_workload_ids = 5;
  NodeCapabilities capabilities = 6;
}

message DesiredBuild {
  string id = 1;
  string workload_id = 2;
  string git_url = 3;
  string git_ref = 4;
  string dockerfile_path = 5;
  string image_tag = 6;
  map<string, string> build_args = 7;
  string registry = 8;
}

message ObservedBuild {
  string id = 1;
  string status = 2;
  string image = 3;
  string message = 4;
  repeated string log_lines = 5;
}

message DesiredEdgeRoute {
  string domain_id = 1;
  string hostname = 2;
  string upstream = 3;
  string tls_mode = 4;
  int64 edge_generation = 5;
  string action = 6; // upsert | delete
}

message DesiredEdgePlan {
  int64 generation = 1;
  repeated DesiredEdgeRoute routes = 2;
  string acme_ca = 3;
  string caddy_admin_url = 4;
}

message ObservedEdge {
  int64 generation = 1;
  string status = 2;
  string message = 3;
  repeated string log_lines = 4;
  map<string, string> route_statuses = 5;
}

message HeartbeatResponse {
  string node_id = 1;
  repeated DesiredWorkload desired_workloads = 2;
  repeated DesiredBuild desired_builds = 3;
  DesiredEdgePlan desired_edge = 4;
}

message ReportObservedRequest {
  string node_id = 1;
  repeated ObservedWorkload workloads = 2;
}

message ReportObservedResponse {}

message ReportBuildRequest {
  string node_id = 1;
  ObservedBuild build = 2;
}

message ReportBuildResponse {}

message ReportEdgeRequest {
  string node_id = 1;
  ObservedEdge edge = 2;
}

message ReportEdgeResponse {}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message ConnectStreamRequest {
  string node_id = 1;
  string status = 2;
  repeated string running_workload_ids = 3;
  NodeHeartbeat heartbeat = 4;
}

message ConnectStreamResponse {
  string node_id = 1;
  repeated DesiredWorkload desired_workloads = 2;
  string command = 3;
}

service AgentService {
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);
  rpc EnrollNode(EnrollNodeRequest) returns (EnrollNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportObserved(ReportObservedRequest) returns (ReportObservedResponse);
  rpc ReportBuild(ReportBuildRequest) returns (ReportBuildResponse);
  rpc ReportEdge(ReportEdgeRequest) returns (ReportEdgeResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc ConnectStream(stream ConnectStreamRequest) returns (stream ConnectStreamResponse);
}
