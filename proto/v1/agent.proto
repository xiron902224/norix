syntax = "proto3";

package v1;

import "v1/workload.proto";

option go_package = "github.com/xiron902224/norix/control-plane/internal/gen/v1;paasv1";

message NodeCapabilities {
  int32 cpu_cores = 1;
  int64 memory_total_mb = 2;
  bool docker_socket = 3;
  bool containerd_socket = 4;
  uint32 kvm_level = 5;
  string hostname = 6;
  string agent_version = 7;
}

message NodeHeartbeat {
  string node_id = 1;
  double cpu_usage_percent = 2;
  int64 memory_free_mb = 3;
  uint32 kvm_level = 4;
}

message Node {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string status = 4;
  string last_seen_at = 5;
  NodeCapabilities capabilities = 6;
  bool is_local = 7;
  double cpu_usage_percent = 8;
  int64 memory_free_mb = 9;
  int64 disk_free_mb = 10;
  // worker | edge
  string role = 11;
  bool cordoned = 12;
  bool draining = 13;
  string zone = 14;
  map<string, string> labels = 15;
  // Workload IDs last reported by the agent (container labels).
  repeated string reported_workload_ids = 16;
  // Target agent release (e.g. 1.0.0-beta.4). Empty = no pending update.
  string desired_agent_version = 17;
  // True after RotateNodeToken until the agent receives rotated_node_token (#13).
  bool credential_rotate_pending = 18;
  // True when a client-cert SHA-256 fingerprint is stored for optional mTLS (#13).
  bool client_cert_configured = 19;
}

message CordonNodeRequest {
  string node_id = 1;
  bool cordoned = 2;
}

message CordonNodeResponse {
  Node node = 1;
}

message DrainNodeRequest {
  string node_id = 1;
  bool draining = 2;
}

message DrainNodeResponse {
  Node node = 1;
  // Stateful workloads with volumes that will not be auto-moved (#16).
  repeated string warnings = 2;
}

message UpdateNodeScheduleRequest {
  string node_id = 1;
  string role = 2;
  string zone = 3;
  map<string, string> labels = 4;
}

message UpdateNodeScheduleResponse {
  Node node = 1;
}

message CreateJoinTokenRequest {
  string node_name = 1;
  int64 ttl_seconds = 2;
}

message CreateJoinTokenResponse {
  string token = 1;
  string expires_at = 2;
}

message EnrollNodeRequest {
  string join_token = 1;
  string node_name = 2;
  NodeCapabilities capabilities = 3;
}

message EnrollNodeResponse {
  string node_id = 1;
  string node_token = 2;
  string organization_id = 3;
}

message DesiredWorkload {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string image = 4;
  map<string, string> env_vars = 5;
  int32 cpu_shares = 6;
  int64 memory_limit_mb = 7;
  int32 host_port = 8;
  int32 container_port = 9;
  int64 desired_generation = 10;
  string action = 11;
  // container | docker-compose | microvm | wasm | static-site
  string runtime = 12;
  // Optional docker network for compose stacks (norix-stack-<id>).
  string network_name = 13;
  string network_alias = 14;
  // rolling | recreate (#15). Empty defaults to rolling on the agent.
  string update_strategy = 15;
  // Temporary host port for start-before-stop; 0 = agent picks a free port.
  int32 surge_host_port = 16;
  // HTTP path for readiness during rolling (default "/"); empty skips HTTP and uses TCP.
  string readiness_path = 17;
  // JSON ProbeSpec (#17).
  string probe_spec_json = 18;
  // JSON array of {name,mount_path,read_only} (#16).
  string volume_mounts_json = 19;
  // Pending backup|delete JSON (#16).
  string volume_pending_op_json = 20;
  // Parent workload id (stable Docker volume naming).
  string workload_id = 21;
}

message DesiredWasmFunction {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string image_ref = 4;
  int64 fuel_limit = 5;
  int32 memory_limit_mb = 6;
  int32 listen_port = 7;
  string hostname = 8;
}

message DesiredWasmPlan {
  int64 generation = 1;
  repeated DesiredWasmFunction functions = 2;
}

message ObservedWasmFunction {
  string id = 1;
  string status = 2;
  string message = 3;
  string artifact_path = 4;
}

message ObservedWasm {
  int64 generation = 1;
  string status = 2;
  string message = 3;
  repeated string log_lines = 4;
  repeated ObservedWasmFunction functions = 5;
}

message ReportWasmRequest {
  string node_id = 1;
  ObservedWasm wasm = 2;
}

message ReportWasmResponse {}

message ObservedWorkload {
  string id = 1;
  string status = 2;
  string container_id = 3;
  int64 observed_generation = 4;
  string message = 5;
  int32 host_port = 6;
  repeated string log_lines = 7;
  bool ready = 8;
  string probe_status_json = 9;
}

message HeartbeatRequest {
  string node_id = 1;
  double cpu_usage_percent = 2;
  int64 memory_free_mb = 3;
  string status = 4;
  repeated string running_workload_ids = 5;
  NodeCapabilities capabilities = 6;
  // Observed managed database containers (#20).
  repeated ObservedManagedDatabase observed_managed_databases = 7;
}

// Desired managed DB engine container for a node (#20).
message DesiredManagedDatabase {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string engine = 4; // postgres | mysql | redis
  string image = 5;
  map<string, string> env_vars = 6;
  repeated string command = 7;
  int32 host_port = 8;
  int32 container_port = 9;
  string volume_name = 10;
  string volume_mount_path = 11;
  string action = 12; // run | stop
}

message ObservedManagedDatabase {
  string id = 1;
  string status = 2; // ready | provisioning | failed | stopped
  string container_id = 3;
  string message = 4;
  int32 host_port = 5;
}

message DesiredBuild {
  string id = 1;
  string workload_id = 2;
  string git_url = 3;
  string git_ref = 4;
  string dockerfile_path = 5;
  string image_tag = 6;
  map<string, string> build_args = 7;
  string registry = 8;
}

message ObservedBuild {
  string id = 1;
  string status = 2;
  string image = 3;
  string message = 4;
  repeated string log_lines = 5;
}

message DesiredEdgeRoute {
  string domain_id = 1;
  string hostname = 2;
  string upstream = 3;
  string tls_mode = 4;
  int64 edge_generation = 5;
  string action = 6; // upsert | delete
}

message DesiredEdgePlan {
  int64 generation = 1;
  repeated DesiredEdgeRoute routes = 2;
  string acme_ca = 3;
  string caddy_admin_url = 4;
}

message ObservedEdge {
  int64 generation = 1;
  string status = 2;
  string message = 3;
  repeated string log_lines = 4;
  map<string, string> route_statuses = 5;
}

message DesiredNetworkPeer {
  string node_id = 1;
  string node_name = 2;
  string public_key = 3;
  string address = 4;
  string endpoint = 5;
  string allowed_ips = 6;
}

message DesiredNetworkDNSRecord {
  string name = 1;
  string type = 2;
  string value = 3;
  int32 ttl_seconds = 4;
}

message DesiredNetworkCertificate {
  string hostname = 1;
  string cert_pem = 2;
  string key_pem = 3;
  string not_after = 4;
  string issuer = 5;
}

message DesiredNetworkPlan {
  int64 generation = 1;
  string interface = 2;
  string address = 3;
  int32 listen_port = 4;
  string private_key = 5;
  string public_key = 6;
  repeated DesiredNetworkPeer peers = 7;
  repeated DesiredNetworkDNSRecord dns_records = 8;
  string nftables = 9;
  string wg_config = 10;
  repeated DesiredNetworkCertificate certificates = 11;
  bool apply = 12;
}

message ObservedNetwork {
  int64 generation = 1;
  string status = 2;
  string message = 3;
  repeated string log_lines = 4;
}

// Compose stack the agent applies with `docker compose` (#143).
message DesiredComposeStack {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string git_url = 4;
  string git_ref = 5;
  string compose_path = 6;
  string compose_project = 7; // docker compose -p value
  string action = 8;          // up | stop | down
  int64 generation = 9;
  repeated string public_services = 10;
  // Decrypted only for the assigned node. The agent must not log values (#145).
  map<string, string> env = 11;
  map<string, string> domains = 12;
  bool purge_volumes = 13;
}

message ObservedComposeService {
  string name = 1;
  string state = 2;
  string health = 3;
  int32 exit_code = 4;
  string image = 5;
  string ports = 6;
  int32 container_port = 7;
}

message ObservedComposeLogLine {
  string service = 1;
  string line = 2;
}

message ObservedComposeStack {
  string id = 1;
  // deploying | running | degraded | stopped | failed | removed
  string status = 2;
  int64 observed_generation = 3;
  string message = 4;
  repeated ObservedComposeService services = 5;
  repeated ObservedComposeLogLine log_lines = 6;
  // Newly generated SERVICE_PASSWORD_* / SERVICE_BASE64_* values. Persist once (#145).
  map<string, string> generated_env = 7;
  repeated ComposeVolume volumes = 8;
}

message ReportComposeStackRequest {
  string node_id = 1;
  ObservedComposeStack stack = 2;
}

message ReportComposeStackResponse {}

message HeartbeatResponse {
  string node_id = 1;
  repeated DesiredWorkload desired_workloads = 2;
  repeated DesiredBuild desired_builds = 3;
  DesiredEdgePlan desired_edge = 4;
  DesiredNetworkPlan desired_network = 5;
  DesiredWasmPlan desired_wasm = 6;
  // When set and different from the running agent, the agent should self-update.
  string desired_agent_version = 7;
  // One-shot replacement node bearer after RotateNodeToken (#13). Agent must persist it.
  string rotated_node_token = 8;
  repeated DesiredManagedDatabase desired_managed_databases = 9;
  repeated DesiredComposeStack desired_compose_stacks = 10;
}

// Long-poll for desired-state changes (#44). Returns when fingerprint differs from
// known_fingerprint, or after timeout_seconds (default 25). Does not record a heartbeat;
// keep Heartbeat for liveness / reclaim.
message WatchDesiredRequest {
  string node_id = 1;
  // Opaque fingerprint from the previous WatchDesiredResponse. Empty = return current state now.
  string known_fingerprint = 2;
  // Max seconds to wait (default 25, max 30).
  int32 timeout_seconds = 3;
}

message WatchDesiredResponse {
  string node_id = 1;
  string fingerprint = 2;
  // true when fingerprint differs from known_fingerprint (or known was empty).
  bool changed = 3;
  // true when the wait ended because timeout elapsed with no change.
  bool timed_out = 4;
  repeated DesiredWorkload desired_workloads = 5;
  repeated DesiredBuild desired_builds = 6;
  DesiredEdgePlan desired_edge = 7;
  DesiredNetworkPlan desired_network = 8;
  DesiredWasmPlan desired_wasm = 9;
  string desired_agent_version = 10;
  repeated DesiredManagedDatabase desired_managed_databases = 11;
  repeated DesiredComposeStack desired_compose_stacks = 12;
}

message RotateNodeTokenRequest {
  string node_id = 1;
}

message RotateNodeTokenResponse {
  Node node = 1;
  string message = 2;
}

// Rotate WireGuard identity for one node; bumps org network_generation so peers refresh (#48).
message RotateNodeWireGuardKeysRequest {
  string node_id = 1;
}

message RotateNodeWireGuardKeysResponse {
  Node node = 1;
  string message = 2;
  string wg_public_key = 3;
  string wg_address = 4;
}

message RevokeNodeTokenRequest {
  string node_id = 1;
}

message RevokeNodeTokenResponse {
  Node node = 1;
}

message SetNodeClientCertRequest {
  string node_id = 1;
  // SHA-256 hex (64 chars) of the DER client certificate. Empty clears mTLS binding.
  string certificate_sha256 = 2;
}

message SetNodeClientCertResponse {
  Node node = 1;
}

message UpdateNodeAgentRequest {
  string node_id = 1;
  // Release tag or semver (v optional), e.g. v1.0.0-beta.4. Empty = match control-plane version.
  string version = 2;
}

message UpdateNodeAgentResponse {
  Node node = 1;
}

message ReportObservedRequest {
  string node_id = 1;
  repeated ObservedWorkload workloads = 2;
}

message ReportObservedResponse {}

message ReportBuildRequest {
  string node_id = 1;
  ObservedBuild build = 2;
}

message ReportBuildResponse {}

message ReportEdgeRequest {
  string node_id = 1;
  ObservedEdge edge = 2;
}

message ReportEdgeResponse {}

message ReportNetworkRequest {
  string node_id = 1;
  ObservedNetwork network = 2;
}

message ReportNetworkResponse {}

message GetNetworkStatusRequest {}

message NodeNetworkStatus {
  string node_id = 1;
  string name = 2;
  string role = 3;
  string status = 4;
  string wg_address = 5;
  string wg_public_key = 6;
  string network_status = 7;
  string last_error = 8;
  int64 generation = 9;
  int64 observed_generation = 10;
}

message GetNetworkStatusResponse {
  int32 nodes_ready = 1;
  int32 nodes_total = 2;
  int32 dns_records = 3;
  int32 certificates = 4;
  string overlay_cidr = 5;
  string dns_suffix = 6;
  bool apply_enabled = 7;
  repeated NodeNetworkStatus nodes = 8;
  repeated DesiredNetworkDNSRecord records = 9;
}

message UpsertEgressPolicyRequest {
  string workload_id = 1;
  // allow | deny | allowlist
  string mode = 2;
  repeated string allowlist = 3;
}

message UpsertEgressPolicyResponse {
  string workload_id = 1;
  string mode = 2;
  repeated string allowlist = 3;
}

message ListEgressPoliciesRequest {}

message EgressPolicy {
  string id = 1;
  string workload_id = 2;
  string mode = 3;
  repeated string allowlist = 4;
}

message ListEgressPoliciesResponse {
  repeated EgressPolicy policies = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message ConnectStreamRequest {
  string node_id = 1;
  string status = 2;
  repeated string running_workload_ids = 3;
  NodeHeartbeat heartbeat = 4;
}

message ConnectStreamResponse {
  string node_id = 1;
  repeated DesiredWorkload desired_workloads = 2;
  string command = 3;
}

service AgentService {
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);
  rpc EnrollNode(EnrollNodeRequest) returns (EnrollNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Long-poll desired state so agents converge faster than heartbeat interval (#44).
  rpc WatchDesired(WatchDesiredRequest) returns (WatchDesiredResponse);
  rpc ReportObserved(ReportObservedRequest) returns (ReportObservedResponse);
  rpc ReportBuild(ReportBuildRequest) returns (ReportBuildResponse);
  rpc ReportEdge(ReportEdgeRequest) returns (ReportEdgeResponse);
  rpc ReportNetwork(ReportNetworkRequest) returns (ReportNetworkResponse);
  rpc ReportWasm(ReportWasmRequest) returns (ReportWasmResponse);
  rpc ReportComposeStack(ReportComposeStackRequest) returns (ReportComposeStackResponse);
  rpc GetNetworkStatus(GetNetworkStatusRequest) returns (GetNetworkStatusResponse);
  rpc UpsertEgressPolicy(UpsertEgressPolicyRequest) returns (UpsertEgressPolicyResponse);
  rpc ListEgressPolicies(ListEgressPoliciesRequest) returns (ListEgressPoliciesResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc CordonNode(CordonNodeRequest) returns (CordonNodeResponse);
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
  rpc UpdateNodeSchedule(UpdateNodeScheduleRequest) returns (UpdateNodeScheduleResponse);
  rpc UpdateNodeAgent(UpdateNodeAgentRequest) returns (UpdateNodeAgentResponse);
  rpc RotateNodeToken(RotateNodeTokenRequest) returns (RotateNodeTokenResponse);
  rpc RotateNodeWireGuardKeys(RotateNodeWireGuardKeysRequest) returns (RotateNodeWireGuardKeysResponse);
  rpc RevokeNodeToken(RevokeNodeTokenRequest) returns (RevokeNodeTokenResponse);
  rpc SetNodeClientCert(SetNodeClientCertRequest) returns (SetNodeClientCertResponse);
  rpc ConnectStream(stream ConnectStreamRequest) returns (stream ConnectStreamResponse);
}
