syntax = "proto3";

package v1;

option go_package = "github.com/xiron902224/norix/control-plane/internal/gen/v1;paasv1";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_MEMBER = 3;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  Role role = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  // Required when the user has TOTP enabled or the organization mandates 2FA.
  string totp_code = 3;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}

message GetBootstrapStatusRequest {}

message GetBootstrapStatusResponse {
  bool configured = 1;
}

message CreateInitialAdminRequest {
  string organization_name = 1;
  string admin_name = 2;
  string admin_email = 3;
  string admin_password = 4;
}

message CreateInitialAdminResponse {
  string token = 1;
  User user = 2;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {}

message RenewSessionRequest {
  string token = 1;
}

message RenewSessionResponse {
  string token = 1;
  int64 expires_at_unix = 2;
}

message PersonalAccessToken {
  string id = 1;
  string name = 2;
  string token_prefix = 3;
  repeated string scopes = 4;
  string expires_at = 5;
  string revoked_at = 6;
  string last_used_at = 7;
  string created_at = 8;
}

message CreatePersonalAccessTokenRequest {
  string name = 1;
  repeated string scopes = 2;
  // RFC3339; empty = no expiry
  string expires_at = 3;
}

message CreatePersonalAccessTokenResponse {
  PersonalAccessToken token = 1;
  // Plaintext shown once.
  string plaintext = 2;
}

message ListPersonalAccessTokensRequest {}

message ListPersonalAccessTokensResponse {
  repeated PersonalAccessToken tokens = 1;
}

message RevokePersonalAccessTokenRequest {
  string id = 1;
}

message RevokePersonalAccessTokenResponse {}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetBootstrapStatus(GetBootstrapStatusRequest) returns (GetBootstrapStatusResponse);
  rpc CreateInitialAdmin(CreateInitialAdminRequest) returns (CreateInitialAdminResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RenewSession(RenewSessionRequest) returns (RenewSessionResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc CreatePersonalAccessToken(CreatePersonalAccessTokenRequest) returns (CreatePersonalAccessTokenResponse);
  rpc ListPersonalAccessTokens(ListPersonalAccessTokensRequest) returns (ListPersonalAccessTokensResponse);
  rpc RevokePersonalAccessToken(RevokePersonalAccessTokenRequest) returns (RevokePersonalAccessTokenResponse);
}
