syntax = "proto3";

package v1;

option go_package = "github.com/xiron902224/norix/control-plane/internal/gen/v1;paasv1";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_MEMBER = 3;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  Role role = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}

message GetBootstrapStatusRequest {}

message GetBootstrapStatusResponse {
  bool configured = 1;
}

message CreateInitialAdminRequest {
  string organization_name = 1;
  string admin_name = 2;
  string admin_email = 3;
  string admin_password = 4;
}

message CreateInitialAdminResponse {
  string token = 1;
  User user = 2;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {}

message RenewSessionRequest {
  string token = 1;
}

message RenewSessionResponse {
  string token = 1;
  int64 expires_at_unix = 2;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetBootstrapStatus(GetBootstrapStatusRequest) returns (GetBootstrapStatusResponse);
  rpc CreateInitialAdmin(CreateInitialAdminRequest) returns (CreateInitialAdminResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RenewSession(RenewSessionRequest) returns (RenewSessionResponse);
}
