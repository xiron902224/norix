syntax = "proto3";

package v1;

option go_package = "github.com/xiron902224/norix/control-plane/internal/gen/v1;paasv1";

enum RuntimeType {
  RUNTIME_TYPE_UNSPECIFIED = 0;
  RUNTIME_TYPE_CONTAINER = 1;
  RUNTIME_TYPE_DOCKER_COMPOSE = 2;
  RUNTIME_TYPE_MICROVM = 3;
  RUNTIME_TYPE_WASM = 4;
  RUNTIME_TYPE_STATIC_SITE = 5;
}

message Workload {
  string id = 1;
  string project_id = 2;
  string name = 3;
  RuntimeType runtime = 4;
  string image_or_source = 5;
  map<string, string> env_vars = 6;
  int32 cpu_shares = 7;
  int64 memory_limit_mb = 8;
  string domain = 9;
  string status = 10;
  int64 desired_generation = 11;
  int64 observed_generation = 12;
  int32 host_port = 13;
  int32 container_port = 14;
  string assigned_node_id = 15;
  string endpoint = 16;
  string last_error = 17;
  string container_id = 18;
  // image | git
  string source_kind = 19;
  string git_url = 20;
  string git_ref = 21;
  string dockerfile_path = 22;
  string latest_build_id = 23;
}

message ListWorkloadsRequest {
  string project_id = 1;
}

message ListWorkloadsResponse {
  repeated Workload workloads = 1;
}

message UpdateWorkloadRequest {
  Workload workload = 1;
}

message UpdateWorkloadResponse {
  Workload workload = 1;
}

message DeleteWorkloadRequest {
  string id = 1;
}

message DeleteWorkloadResponse {}

message CreateWorkloadRequest {
  Workload workload = 1;
}
message CreateWorkloadResponse { Workload workload = 1; }

message DeployRequest {
  Workload workload = 1;
  int32 container_port = 2;
}

message DeployResponse {
  string deployment_id = 1;
  string status = 2;
  int32 host_port = 3;
  string assigned_node_id = 4;
}

message GetWorkloadLogsRequest {
  string workload_id = 1;
  int32 tail_lines = 2;
}

message GetWorkloadLogsResponse {
  repeated string lines = 1;
}

message Build {
  string id = 1;
  string workload_id = 2;
  string git_url = 3;
  string git_ref = 4;
  string dockerfile_path = 5;
  string status = 6;
  string image = 7;
  string assigned_node_id = 8;
  string last_error = 9;
  string created_at = 10;
  string updated_at = 11;
}

message DeployFromGitRequest {
  string workload_id = 1;
  string git_url = 2;
  string git_ref = 3;
  string dockerfile_path = 4;
  int32 container_port = 5;
  // optional plaintext build secrets (encrypted at rest)
  map<string, string> build_secrets = 6;
}

message DeployFromGitResponse {
  string build_id = 1;
  string workload_id = 2;
  string status = 3;
}

message ListBuildsRequest {
  string workload_id = 1;
}

message ListBuildsResponse {
  repeated Build builds = 1;
}

message GetBuildLogsRequest {
  string build_id = 1;
  int32 tail_lines = 2;
}

message GetBuildLogsResponse {
  Build build = 1;
  repeated string lines = 2;
}

service WorkloadService {
  rpc CreateWorkload(CreateWorkloadRequest) returns (CreateWorkloadResponse);
  rpc Deploy(DeployRequest) returns (DeployResponse);
  rpc DeployFromGit(DeployFromGitRequest) returns (DeployFromGitResponse);
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse);
  rpc UpdateWorkload(UpdateWorkloadRequest) returns (UpdateWorkloadResponse);
  rpc DeleteWorkload(DeleteWorkloadRequest) returns (DeleteWorkloadResponse);
  rpc GetWorkloadLogs(GetWorkloadLogsRequest) returns (GetWorkloadLogsResponse);
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);
  rpc GetBuildLogs(GetBuildLogsRequest) returns (GetBuildLogsResponse);
}

message Project {
  string id = 1;
  string organization_id = 2;
  string name = 3;
}

message CreateProjectRequest {
  string name = 1;
}

message CreateProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message DeleteProjectRequest {
  string id = 1;
}

message DeleteProjectResponse {}

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
}
