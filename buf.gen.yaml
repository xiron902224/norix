version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/grpc/go
    # - local: protoc-gen-go
    out: control-plane/internal/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    # - local: protoc-gen-connect-go
    out: control-plane/internal/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/es
    # - local: protoc-gen-connect-es
    out: web/src/gen
    opt: target=ts
