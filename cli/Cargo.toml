[package]
name = "norix"
version = "1.0.0-beta.5"
edition = "2021"
license = "Apache-2.0"
description = "Norix control-plane CLI (Rust) — ops against the Connect API"
publish = false
repository = "https://github.com/xiron902224/norix"

[[bin]]
name = "norix"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
httpmock = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = true
