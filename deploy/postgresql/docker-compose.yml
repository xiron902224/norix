services:
  postgres:
    image: postgres:16-alpine
    container_name: norix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-norix}
      POSTGRES_USER: ${POSTGRES_USER:-norix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - norix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-norix} -d ${POSTGRES_DB:-norix}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - norix

volumes:
  norix_postgres_data:

networks:
  norix:
    name: norix
    driver: bridge
