scope: __SCOPE__
namespace: /norix/
name: __NAME__

restapi:
  listen: 0.0.0.0:8008
  connect_address: __RESTAPI_CONNECT__

etcd3:
  hosts: __ETCD_HOSTS__

bootstrap:
  dcs:
    # Lab values: faster leader expiry for failover smoke (#52). Raise for production.
    ttl: 20
    loop_wait: 5
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        max_connections: 100
        shared_buffers: 128MB
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
  initdb:
    - encoding: UTF8
    - data-checksums
  users:
    admin:
      password: __SUPERUSER_PASSWORD__
      options:
        - createrole
        - createdb

postgresql:
  listen: 0.0.0.0:5432
  connect_address: __PG_CONNECT__
  data_dir: __DATA_DIR__
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: __REPLICATION_PASSWORD__
    superuser:
      username: postgres
      password: __SUPERUSER_PASSWORD__
  parameters:
    unix_socket_directories: /var/run/postgresql
  # Lab-only: allow password auth from Docker/HAProxy networks (#52).
  pg_hba:
    - local all all trust
    - host all all 127.0.0.1/32 md5
    - host all all ::1/128 md5
    - host all all 0.0.0.0/0 md5
    - host replication replicator 0.0.0.0/0 md5

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
