# Local Patroni HA stack for Norix control-plane Postgres (2 replicas + etcd).
# Usage:
#   cd deploy/postgresql/patroni && docker compose up -d
#   export DATABASE_URL=postgres://norix:norix@127.0.0.1:5000/norix?sslmode=disable
# VIP/HAProxy listens on 5000 (primary) and 5001 (replicas).

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
    networks: [norix-ha]

  patroni1:
    image: ghcr.io/patroni/patroni:4.0.4
    environment:
      PATRONI_NAME: patroni1
      PATRONI_SCOPE: norix
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni1:8008
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/pgdata/pgroot/data
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: norix-super
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: norix-repl
      PATRONI_admin_PASSWORD: norix
      PATRONI_admin_OPTIONS: createrole,createdb
    volumes:
      - patroni1_data:/home/postgres/pgdata
    networks: [norix-ha]
    depends_on: [etcd]

  patroni2:
    image: ghcr.io/patroni/patroni:4.0.4
    environment:
      PATRONI_NAME: patroni2
      PATRONI_SCOPE: norix
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni2:8008
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/pgdata/pgroot/data
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: norix-super
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: norix-repl
      PATRONI_admin_PASSWORD: norix
      PATRONI_admin_OPTIONS: createrole,createdb
    volumes:
      - patroni2_data:/home/postgres/pgdata
    networks: [norix-ha]
    depends_on: [etcd]

  haproxy:
    image: haproxy:2.9-alpine
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:5001:5001"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [norix-ha]
    depends_on: [patroni1, patroni2]

networks:
  norix-ha:

volumes:
  patroni1_data:
  patroni2_data:
