global
  maxconn 100
  # No stats socket — alpine image cannot bind /var/run/haproxy.sock as non-root.

defaults
  log global
  mode tcp
  retries 2
  timeout client 30m
  timeout connect 4s
  timeout server 30m
  option clitcpka

listen stats
  mode http
  bind *:7000
  stats enable
  stats uri /
  stats refresh 10s

listen postgres_primary
  bind *:5432
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server patroni1 patroni1:5432 maxconn 100 check port 8008
  server patroni2 patroni2:5432 maxconn 100 check port 8008
