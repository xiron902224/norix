# Self-host production stack (Coolify / OpenShip-shaped).
# Used by scripts/get-norix.sh — pulls or builds published images.
#
# Default: postgres + control-plane (UI embed) with host docker.sock
# so the first VPS is both panel and first worker (localruntime).
#
# Usage:
#   docker compose --env-file /data/norix/source/.env -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-norix}
      POSTGRES_USER: ${POSTGRES_USER:-norix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    volumes:
      - norix_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [norix]
    # Not published publicly — only on the compose network.

  control-plane:
    build:
      context: ../..
      dockerfile: control-plane/Dockerfile.prod
    image: ${NORIX_IMAGE_CONTROL_PLANE:-ghcr.io/xiron902224/norix-control-plane:${NORIX_VERSION:-1.0.0-beta.1}}
    pull_policy: ${NORIX_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      NORIX_PUBLIC_URL: ${NORIX_PUBLIC_URL:-http://127.0.0.1:8000}
      NORIX_WEB_ORIGIN: ${NORIX_WEB_ORIGIN:-http://127.0.0.1:8000}
      NORIX_BACKUP_DIR: /var/lib/norix/backups
      NORIX_BUILD_SECRETS_KEY: ${NORIX_BUILD_SECRETS_KEY:-}
      NORIX_REGISTRY: ${NORIX_REGISTRY:-none}
      NORIX_ALERT_WEBHOOK_URL: ${NORIX_ALERT_WEBHOOK_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - norix_backups:/var/lib/norix/backups
    ports:
      # Panel + API on the host (OpenShip/Coolify-style public port).
      - "${NORIX_HTTP_PORT:-8000}:8080"
    networks: [norix]

  # Optional remote-style agent on the same host (usually unnecessary —
  # control-plane localruntime already uses docker.sock).
  agent:
    profiles: ["agent"]
    build:
      context: ../..
      dockerfile: agent/Dockerfile
    image: ${NORIX_IMAGE_AGENT:-ghcr.io/xiron902224/norix-agent:${NORIX_VERSION:-1.0.0-beta.1}}
    pull_policy: ${NORIX_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      - control-plane
    environment:
      NORIX_CONTROL_PLANE_URL: http://control-plane:8080
      NORIX_JOIN_TOKEN: ${NORIX_JOIN_TOKEN:-}
      NORIX_NODE_NAME: ${NORIX_NODE_NAME:-norix-1}
      NORIX_AGENT_WORKDIR: /var/lib/norix-agent
      NORIX_HEARTBEAT_SECS: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - norix_agent_data:/var/lib/norix-agent
    networks: [norix]

volumes:
  norix_postgres_data:
  norix_backups:
  norix_agent_data:

networks:
  norix:
    driver: bridge
