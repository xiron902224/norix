services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - norix_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [norix]

  # Optional: full stack in Docker. For local API+web development prefer:
  #   docker compose ... up -d postgres
  #   then run control-plane and Vite on the host.
  control-plane:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: control-plane/Dockerfile
    image: norix/control-plane:local
    pull_policy: build
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      HTTP_ADDR: :8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks: [norix]

  # Local OCI registry (zot) for S5 git→build→push.
  registry:
    profiles: ["registry"]
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - norix_registry_data:/var/lib/registry
      - ./zot-config.json:/etc/zot/config.json:ro
    networks: [norix]

  # ACME test CA (Pebble) for local TLS issuance.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: ["-config", "/test/config/pebble-config.json", "-strict"]
    environment:
      PEBBLE_VA_ALWAYS_VALID: "1"
    ports:
      - "127.0.0.1:14000:14000"
      - "127.0.0.1:15000:15000"
    networks: [norix]

  # Edge proxy — agent/localruntime loads routes via admin API :2019.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./Caddyfile.bootstrap:/etc/caddy/Caddyfile:ro
      - norix_caddy_data:/data
      - norix_caddy_config:/config
    environment:
      NORIX_ACME_CA: ${NORIX_ACME_CA:-https://pebble:14000/dir}
    depends_on:
      - pebble
    networks: [norix]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  norix_postgres_data:
  norix_registry_data:
  norix_caddy_data:
  norix_caddy_config:

networks:
  norix:
    driver: bridge
