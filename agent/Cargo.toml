[package]
name = "norix-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Norix runtime agent — enrollment, heartbeat, and reconnect"
publish = false

[[bin]]
name = "norix-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
